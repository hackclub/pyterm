[package]
name = "pyterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"

[dependencies]
actix-web = "4.12.1"
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
